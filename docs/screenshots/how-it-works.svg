<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" width="940" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Lloyd's App2Live works</title>
  <desc id="d">Your app sends WAV files and their tempo to the LA2L server. The server keeps them until you click Import in the LA2L device in Ableton Live. Every sound then becomes a new audio track, named, coloured and warped. Once, you pair the app by typing the code the device shows.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- 1. The app -->
  <rect x="20" y="20" width="180" height="170" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">1. Your app</text>
  <text x="110" y="74" text-anchor="middle" font-size="13" fill="#1e293b">Android or web.</text>
  <text x="110" y="92" text-anchor="middle" font-size="13" fill="#1e293b">Sends WAV + tempo.</text>
  <rect x="88" y="106" width="44" height="72" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="94,142 99,142 102,130 106,154 110,124 114,160 118,134 121,142 126,142" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>

  <!-- 2. The server -->
  <rect x="252" y="20" width="180" height="170" rx="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="342" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">2. LA2L server</text>
  <text x="342" y="74" text-anchor="middle" font-size="13" fill="#1e293b">Keeps the sounds</text>
  <text x="342" y="92" text-anchor="middle" font-size="13" fill="#1e293b">until you import.</text>
  <rect x="302" y="108" width="80" height="20" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <rect x="302" y="132" width="80" height="20" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <rect x="302" y="156" width="80" height="20" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <circle cx="314" cy="118" r="3" fill="#22c55e"/><circle cx="314" cy="142" r="3" fill="#22c55e"/><circle cx="314" cy="166" r="3" fill="#22c55e"/>

  <!-- 3. The device -->
  <rect x="484" y="20" width="180" height="170" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="574" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">3. LA2L in Live</text>
  <text x="574" y="74" text-anchor="middle" font-size="13" fill="#1e293b">The Max for Live device.</text>
  <text x="574" y="92" text-anchor="middle" font-size="13" fill="#1e293b">You click Import.</text>
  <rect x="514" y="108" width="120" height="68" rx="6" fill="#3a3a3a" stroke="#1f1f1f" stroke-width="2"/>
  <rect x="524" y="126" width="100" height="26" rx="13" fill="#ff9a2e"/>
  <text x="574" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Import</text>

  <!-- 4. The tracks -->
  <rect x="716" y="20" width="204" height="170" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="818" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">4. New audio tracks</text>
  <text x="818" y="74" text-anchor="middle" font-size="13" fill="#1e293b">One per sound: named,</text>
  <text x="818" y="92" text-anchor="middle" font-size="13" fill="#1e293b">coloured, warped.</text>
  <rect x="738" y="108" width="160" height="68" rx="6" fill="#3a3a3a"/>
  <rect x="746" y="114" width="40" height="16" rx="2" fill="#f87171"/><rect x="790" y="114" width="40" height="16" rx="2" fill="#f87171"/><rect x="834" y="114" width="40" height="16" rx="2" fill="#f87171"/>
  <rect x="746" y="134" width="84" height="16" rx="2" fill="#60a5fa"/><rect x="834" y="134" width="56" height="16" rx="2" fill="#60a5fa"/>
  <rect x="746" y="154" width="60" height="16" rx="2" fill="#facc15"/><rect x="810" y="154" width="60" height="16" rx="2" fill="#facc15"/>

  <!-- Arrows -->
  <line x1="204" y1="105" x2="246" y2="105" stroke="#8b949e" stroke-width="3" marker-end="url(#a)"/>
  <line x1="436" y1="105" x2="478" y2="105" stroke="#8b949e" stroke-width="3" marker-end="url(#a)"/>
  <line x1="668" y1="105" x2="710" y2="105" stroke="#8b949e" stroke-width="3" marker-end="url(#a)"/>

  <!-- Pairing, once -->
  <path d="M574 194 V250 H110 V198" fill="none" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <rect x="172" y="234" width="340" height="32" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="342" y="255" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="700">Once:</tspan> type the code LA2L shows into your app</text>
</svg>
