<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LA2L Sender</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="sender.css">
</head>
<body>
<header class="top">
  <img src="logo.png" alt="" width="60" height="60">
  <div>
    <h1>LA2L Sender</h1>
    <p>Sends sounds to the LA2L device in Ableton Live.</p>
  </div>
</header>
<main>
  <section class="card" aria-labelledby="share-title">
