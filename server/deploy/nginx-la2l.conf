# LA2L in nginx: https://<domain>/la2l/ goes to the la2l-server container on 127.0.0.1:8787,
# with the /la2l prefix taken off (/la2l/api/health arrives as /api/health).
# Installed as /etc/nginx/snippets/la2l.conf and included in the 443 server block of the
# domain; install-nginx.sh in this folder does both.
#
# ^~ makes this prefix win over the site's regular-expression locations. Uploads of 200 MB go
# straight through (no request buffering), downloads are not buffered or compressed, and the
# time-outs allow a slow upload from a phone.

location = /la2l { return 301 /la2l/; }

location ^~ /la2l/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    gzip off;
}
