# Both test suites and the server's Docker image, on every push and pull request, so a broken
# test or Dockerfile shows up before it reaches the VPS.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Device tests
        run: npm test
      - name: Server tests
        run: npm test
        working-directory: server
      - name: Docker image
        run: docker build -f server/Dockerfile .
