# Every test suite, the server's Docker image and its deploy scripts, on every push and pull
# request, so a broken test, Dockerfile or script shows up before it reaches the VPS.
# Every action is pinned to a commit, with its release in the comment; update the two together.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Both run the shared fixtures of sdk/fixtures; the device tests also check that the
      # fixtures are what sdk/fixtures/make.js makes.
      - name: Device tests
        run: npm test
      - name: Server tests
        run: npm test
        working-directory: server
      - name: The committed developer pages are what docs/developers makes
        run: node tools/devpages.js --check
      - name: Docker image
        run: docker build -f server/Dockerfile .
      - name: Deploy scripts
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 deploy/*.sh
        working-directory: server

  # @lloydstellar/la2l on npm, on every Node.js version that still gets security fixes. Its tests also hold
  # docs/openapi.yaml and docs/app2live-1.schema.json to the real server and the fixtures.
  sdk-js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the pinned dev tools
        run: npm ci
      - name: The committed server/public/vendor/la2l.js is a fresh build
        run: npm run check:vendor
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Lint docs/openapi.yaml
        run: npm run lint
        env:
          REDOCLY_TELEMETRY: 'off'
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
      # The test receiver and LA2L Sender in headless Chromium, once.
      - name: Browser tests
        if: matrix.node == 24
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:browser

  # The README says la2l works in Deno and Bun: a send through the local test receiver in both.
  sdk-js-runtimes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: npm ci && npm run build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Deno
        run: deno run -A test-runtimes/smoke.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Bun
        run: bun test-runtimes/smoke.mjs

  # The Android SDK and its two example apps. Android builds run here only, never on the VPS
  # (sdk/BUILD-PROMPT.md, 12.5). The tests of the libraries run against the real server of this
  # repository with the test receiver of sdk/js, so they need Node and a build of sdk/js. The
  # example apps and the Maven repository come out as an artifact, to install on a phone.
  android:
    # The Ubuntu of the Android SDK on the runner, pinned until a newer image is checked.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build la2l for the integration tests
        run: npm ci && npm run build
        working-directory: sdk/js
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 8.14.6
      - name: Tests, the libraries, the example apps and the Maven repository
        run: >-
          gradle --no-daemon --stacktrace
          :la2l:testDebugUnitTest :la2l-ktx:testDebugUnitTest
          :la2l:assembleRelease :la2l-ktx:assembleRelease :la2l:lintRelease :la2l-ktx:lintRelease
          :android-recorder:assembleDebug :android-java:assembleDebug
          publishReleasePublicationToLocalRepository
        working-directory: sdk/android
      - name: la2l-ktx asks for the Kotlin 2.1 standard library, so apps on Kotlin 2.1 can use it
        run: grep -A1 "<artifactId>kotlin-stdlib</artifactId>" sdk/android/build/maven/nl/lloydstellar/la2l-ktx/*/la2l-ktx-*.pom | grep -q "<version>2.1.0</version>"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: la2l-android
          if-no-files-found: ignore
          path: |
            examples/android-recorder/build/outputs/apk/debug/*.apk
            examples/android-java/build/outputs/apk/debug/*.apk
            sdk/android/build/maven/
            sdk/android/*/build/reports/tests/
            sdk/android/*/build/reports/lint-results-*.html
