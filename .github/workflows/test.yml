# Every test suite, the server's Docker image and its deploy scripts, on every push and pull
# request, so a broken test, Dockerfile or script shows up before it reaches the VPS.
# Every action is pinned to a commit, with its release in the comment; update the two together.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Both run the shared fixtures of sdk/fixtures; the device tests also check that the
      # fixtures are what sdk/fixtures/make.js makes.
      - name: Device tests
        run: npm test
      - name: Server tests
        run: npm test
        working-directory: server
      - name: The committed developer pages are what docs/developers makes
        run: node tools/devpages.js --check
      - name: Docker image
        run: docker build -f server/Dockerfile .
      - name: Deploy scripts
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 deploy/*.sh
        working-directory: server

  # la2l on npm, on every Node.js version that still gets security fixes. Its tests also hold
  # docs/openapi.yaml and docs/app2live-1.schema.json to the real server and the fixtures.
  sdk-js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the pinned dev tools
        run: npm ci
      - name: The committed server/public/vendor/la2l.js is a fresh build
        run: npm run check:vendor
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Lint docs/openapi.yaml
        run: npm run lint
        env:
          REDOCLY_TELEMETRY: 'off'
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
      # The test receiver and LA2L Sender in headless Chromium, once.
      - name: Browser tests
        if: matrix.node == 24
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:browser

  # The README says la2l works in Deno and Bun: a send through the local test receiver in both.
  sdk-js-runtimes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: npm ci && npm run build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Deno
        run: deno run -A test-runtimes/smoke.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Bun
        run: bun test-runtimes/smoke.mjs
