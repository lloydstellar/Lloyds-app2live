# Both test suites, the server's Docker image and its deploy scripts, on every push and pull
# request, so a broken test, Dockerfile or script shows up before it reaches the VPS.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Device tests
        run: npm test
      - name: Server tests
        run: npm test
        working-directory: server
      - name: Docker image
        run: docker build -f server/Dockerfile .
      - name: Deploy scripts
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 deploy/*.sh
        working-directory: server
